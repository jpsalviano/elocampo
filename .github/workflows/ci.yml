name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes da API (unitários e de integração) contra um MongoDB de verdade.
  api:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      ELOCAMPO_TEST_MONGODB_URI: mongodb://localhost:27017/elocampo-test
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test

  web:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  # Uma imagem por responsabilidade: a API e a web (o banco é a imagem oficial
  # do MongoDB). De main vão para o GHCR com o commit como tag, e o
  # jpsalviano.com.br as fixa por essa tag.
  image:
    timeout-minutes: 30
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        part: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.part }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/jpsalviano/elocampo-${{ matrix.part }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
