server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css image/svg+xml;

    # O Vite nomeia os bundles pelo hash do conteúdo: cache permanente.
    location /elocampo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Qualquer outro caminho é uma rota da aplicação (SPA).
    location /elocampo/ {
        try_files $uri /elocampo/index.html;
        add_header Cache-Control "no-cache";
        # Os próprios arquivos, a API (mesma origem), as imagens que a API serve e o
        # Google Fonts. Repetido em cada location: lá, add_header substitui o do server.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
